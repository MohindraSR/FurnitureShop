spring.application.name=FurnitureShop

# jsp Setting
spring.mvc.view.prefix=/WEB-INF/views/pages/
spring.mvc.view.suffix=.jsp

spring.config.import=optional:file:.env[.properties]

# MySQL DB settings
spring.datasource.url=jdbc:mysql://localhost:3306/furniture_shop?useUnicode=yes&characterEncoding=UTF-8&useConfigs=maxPerformance
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


spring.jpa.open-in-view=false
jwt_secret=${JWT_SECRET}
